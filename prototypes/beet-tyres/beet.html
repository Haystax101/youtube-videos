// ---------- story state as a function of world time w ----------
const T_SPIN = WT(1, 'spin'), T_TIP = WT(1, 'tips'), T_FILL = BS(2), T_WINTER = WT(3, 'winter'), T_FREEZE = WT(3, 'freezes'), T_SALT = WT(4, 'salt'), T_EATS = WT(4, 'eats');
const T_FAC = BS(5), T_BEET = BS(6), T_HEAVY = WT(6, 'heavier'), T_COLD = WT(6, 'freeze'), T_GENTLE = WT(6, 'gentle'), T_PAY = BS(7), T_CTA = BS(8);
function state(w) {
  const s = {};
  s.snow = ease(T_WINTER - 0.2, T_WINTER + 0.9, w);
  // tractor: drives up the lane, sticks in the mud, parks; drives off through the snow at the payoff
  const z0 = -48, zPark = PARK.z + 0.35;
  s.tz = w < T_SPIN ? lerp(z0, zPark, ease(BS(1) - 0.3, T_SPIN, w)) : (w < T_PAY ? zPark : zPark + Math.pow(Math.max(0, w - T_PAY), 1.3) * 2.2);
  s.drive = (w > BS(1) - 0.3 && w < T_SPIN) || w > T_PAY;
  s.spin = w > T_SPIN && w < T_TIP - 0.1;
  s.loader = (w > T_TIP - 0.6 && w < T_FILL) || w > T_PAY;
  s.tip = w < T_FILL ? ease(T_TIP + 0.4, T_TIP + 1.0, w) * (1 - ease(BS(2) - 0.6, BS(2) - 0.1, w)) : 0;
  s.loaderUp = w < T_FILL ? ease(T_TIP - 0.3, T_TIP + 0.6, w) : ease(T_PAY + 0.6, T_PAY + 1.6, w);
  s.inCab = w < T_FILL || w > T_PAY;
  // liquid in the tyre
  s.cut = w > T_FILL - 0.2 && w < T_FAC ? 1 : (w > T_BEET - 0.1 && w < T_PAY ? 1 : 0);
  s.liquid = w < T_FILL ? 0 : (w < T_FAC ? ease(T_FILL + 0.3, T_FILL + 2.2, w) : (w < T_BEET ? 1 : ease(T_BEET, T_BEET + 2.0, w)));
  const water = new THREE.Color('#3d8fe0'), brineC = new THREE.Color('#8fb5a8'), beetC = new THREE.Color('#4e1d16');
  s.col = w < T_SALT ? water : (w < T_BEET ? water.clone().lerp(brineC, ease(T_SALT, T_SALT + 1.2, w)) : beetC);
  s.ice = w < T_SALT ? ease(T_FREEZE, T_FREEZE + 0.6, w) : (w < T_BEET ? 1 - ease(T_SALT + 0.4, T_SALT + 1.4, w) : 0);
  s.salt = w > T_SALT && w < T_BEET ? ease(T_SALT, T_SALT + 1.0, w) : 0;
  s.rust = w < T_EATS || w > T_FAC ? 0 : ease(T_EATS, T_EATS + 2.2, w);
  s.brine = w > T_EATS && w < T_BEET ? ease(T_EATS, T_EATS + 2, w) : 0;
  s.ibc = w > T_BEET - 0.3 && w < T_PAY; s.sack = w > T_SALT - 0.3 && w < T_FAC;
  s.pumping = w > T_BEET && w < T_PAY - 0.5;
  s.thermo = w > T_COLD - 1 && w < T_GENTLE - 0.1 && !hookMode ? 1 : 0;
  return s; }
// standing-farmer pose and spot per beat
function farmerStand(w) {
  if (w < T_FILL + 1.0) return { pos: V(-1.85, 0, -37.75), pose: 'pointdown', expr: 'talk' };
  if (w < T_WINTER) return { pos: V(-1.85, 0, -37.75), pose: 'thumb', expr: 'smug' };
  if (w < T_SALT - 0.3) return { pos: V(-1.85, 0, -37.75), pose: 'shiver', expr: 'worried' };
  if (w < T_EATS) return { pos: V(-1.85, 0, -37.75), pose: 'carry', expr: 'smug' };
  if (w < T_FAC) return { pos: V(-1.85, 0, -37.75), pose: 'shock', expr: 'shocked' };
  if (w < T_HEAVY) return { pos: V(-1.85, 0, -37.75), pose: 'pointdown', expr: 'deadpan' };
  if (w < T_GENTLE) return { pos: V(-1.85, 0, -37.75), pose: 'thumb', expr: 'smug' };
  return { pos: V(-1.85, 0, -37.75), pose: 'point', expr: 'talk' }; }
