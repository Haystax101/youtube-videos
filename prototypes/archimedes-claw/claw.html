const WOOD = '#7a4a2a';

const ships = [];
function ship(o) { const L = o.L || 22, Wd = o.W || 2.4, Hh = o.H || 2.0, D = 1.4; const outer = new THREE.Group(), g = new THREE.Group(); outer.add(g); scene.add(outer);
