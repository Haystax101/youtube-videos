<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }</script></head>
<body><canvas id="gl" width="1080" height="1920"></canvas><script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { makeBighead, toon } from './bighead.js';
import { makeLook } from './look.js';
const q = new URLSearchParams(location.search), W = 1080, H = 1920;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#2a3350');
const cam = new THREE.PerspectiveCamera(40, W / H, 0.05, 200);
const L = makeLook(THREE, { canvas: document.getElementById('gl'), W, H, scene, cam, addons: { EffectComposer, RenderPass, ShaderPass, UnrealBloomPass } });
scene.add(new THREE.HemisphereLight('#e8f0ff', '#8a7060', 1.7));
const sun = new THREE.DirectionalLight('#fff1dc', 2.6); sun.position.set(-3, 6, 5); sun.castShadow = true; sun.shadow.normalBias = 0.03; sun.shadow.bias = -0.0005; sun.shadow.mapSize.set(2048, 2048); scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30).rotateX(-Math.PI / 2), toon(THREE, '#b08a62')); floor.receiveShadow = true; scene.add(floor);
const wall = new THREE.Mesh(new THREE.PlaneGeometry(30, 10), toon(THREE, '#9cb3a3')); wall.position.set(0, 5, -3); wall.receiveShadow = true; scene.add(wall);
const C = [
  makeBighead(THREE, { cloth: '#d9772f', wrap: '#b85d22', pattern: 'weave', scalp: '#e7b4a0', stubble: true }),
  makeBighead(THREE, { cloth: '#26314a', buttons: '#e2b54a', belt: '#1a1a1e', hat: 'police', hatC: '#26314a', badge: '#e2b54a', tache: true }),
  makeBighead(THREE, { cloth: '#4a4a52', collar: '#f2efe6', glasses: true, hair: '#6e6a68', brows: 'thin' }),
  makeBighead(THREE, { cloth: '#7a2a2a', stripes: '#f0e6d6', hat: 'beanie', hatC: '#8a2a2a' }),
];
const ex = ['smug', 'kind', 'happy', 'worried'], po = ['cuffed', 'offer', 'hands_hips', 'wave'];
C.forEach((c, i) => { c.root.position.set(-1.35 + i * 0.9, 0, 0); scene.add(c.root); c.pose(po[i], 1); c.face(ex[i], 1); });
cam.position.set(0.3, 1.1, 6.2); cam.lookAt(0, 0.75, 0);
C.forEach((c) => c.look(cam));
const f = +(q.get('dof') || 0); L.dof(6.2, f); L.render(); window.DONE = true;
</script></body></html>
