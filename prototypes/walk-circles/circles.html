{ const ring = new THREE.RingGeometry(R - 1.3, R + 1.3, 256, 1); const uv = ring.attributes.uv, pos = ring.attributes.position; for (let i = 0; i < uv.count; i++) { const x = pos.getX(i), y = pos.getY(i); uv.setXY(i, (Math.atan2(y, x) / 6.283 + 1) % 1, (Math.hypot(x, y) - (R - 1.3)) / 2.6); }

const people = [];
function person(kind) { const c = document.createElement('canvas'); c.width = CW; c.height = CH; const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;

  { at: WT(1, 'so'), f: (t, u) => { const th = TH_START + 0.27; const p = hikerOn(th, 1, u * 1.4, 'point', 'smug'); showPrints(TH_START - 1, th);

const shotAt = t => { let i = 0; for (let k = 0; k < SHOTS.length; k++) if (t >= SHOTS[k].at) i = k; return i; };

const capEl = document.querySelector('#cap span');
