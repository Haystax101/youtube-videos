<script type="module">
// "Why lost people walk in circles" (full video). Fast-cut style: every shot is its own camera set-up,

import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

import { drawPerson } from './people2d.js';
const TL = await (await fetch('./timeline.json')).json();
const W = 1080, H = 1920, DUR = TL.duration;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));

// ---------- optional CC0 assets (assets/manifest.json, fetched by tools/fetch_assets.py) ----------

function canvasTex(w, h, draw, rep) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep); } return t; }

// ---------- sky, sun, clouds ----------
const skyTex = canvasTex(4, 512, (x) => { const g = x.createLinearGradient(0, 0, 0, 512); g.addColorStop(0, '#4f93d6'); g.addColorStop(0.55, '#b5d7ec'); g.addColorStop(1, '#e9efe0'); x.fillStyle = g; x.fillRect(0, 0, 4, 512); });
const skyGreyTex = canvasTex(4, 512, (x) => { const g = x.createLinearGradient(0, 0, 0, 512); g.addColorStop(0, '#6b747c'); g.addColorStop(0.6, '#9aa3a8'); g.addColorStop(1, '#c4c8c6'); x.fillStyle = g; x.fillRect(0, 0, 4, 512); });

const cloudTex = canvasTex(256, 128, (x, w, h) => { const r = rng(6); for (let i = 0; i < 26; i++) { const cx = 40 + r() * 176, cy = 50 + r() * 40, rad = 18 + r() * 30; const g = x.createRadialGradient(cx, cy, 2, cx, cy, rad); g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, w, h); } });
const clouds = []; { const r = rng(15); for (let i = 0; i < 46; i++) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: cloudTex, transparent: true, fog: false, depthWrite: false, color: '#ffffff' })); const a = r() * 6.283, d = 250 + r() * 500;
  s.position.set(Math.cos(a) * d, 140 + r() * 120, Math.sin(a) * d); s.scale.set(240 + r() * 200, 110 + r() * 80, 1); scene.add(s); clouds.push({ s, a, d, sp: 0.004 + r() * 0.006 }); } }
let GREY = 0; // 0 = sunny, 1 = overcast
function weather(k) { GREY = k; skyGrey.material.opacity = k; sunDisc.material.opacity = 1 - k; sun.intensity = lerp(2.7, 0.35, k); hemi.intensity = lerp(1.15, 0.95, k); hemi.color.set(k > 0.5 ? '#c9d3da' : '#dff0ff');
  scene.fog.color.copy(FOG_DAY).lerp(FOG_GREY, k); clouds.forEach(c => { c.s.material.color.setScalar(lerp(1, 0.62, k)); c.s.material.opacity = lerp(0.85, 1, k); }); finish.uniforms.grey.value = k; }
function sunAt(p) { sun.target.position.copy(p); sun.position.copy(p).add(V(-45, 80, 30)); }

// ---------- environment light from a Poly Haven HDRI if we have one ----------
{ const hdr = files('hdri/forest/').find(f => f.endsWith('.hdr'));
  if (hdr) { const pm = new THREE.PMREMGenerator(renderer); const t = await new Promise(res => new RGBELoader().load('/assets/' + hdr, res, undefined, () => res(null)));
    if (t) { t.mapping = THREE.EquirectangularReflectionMapping; scene.environment = pm.fromEquirectangular(t).texture; scene.environmentIntensity = 0.35; } } }

// ---------- layout ----------
const R = 34, FIRE = V(R, 0, 0);                // the hiker's loop, with the campfire on it
const MEAD = V(260, 0, 0);                       // the open test field east of the forest
const CAMP = V(178, 0, 6);                       // the scientists' camp at the forest edge
const TOWER = V(430, 0, -40);                    // a far landmark: a church tower on a hill
const onLoop = th => V(Math.cos(th) * R, 0, Math.sin(th) * R);
const tangent = th => V(-Math.sin(th), 0, Math.cos(th));
const outward = th => V(Math.cos(th), 0, Math.sin(th));
const frame = (th, along, side, up) => onLoop(th).add(tangent(th).multiplyScalar(along)).add(outward(th).multiplyScalar(side)).add(V(0, up, 0));
const nearLoop = (x, z, m) => Math.abs(Math.hypot(x, z) - R) < m;
const inForest = (x, z) => x < 160 - Math.sin(z * 0.05) * 6 && Math.hypot(x, z) < 230;

// ---------- ground ----------
const groundP = await pbr('ground', 90);
const groundTex = canvasTex(1024, 1024, (x, w, h) => { x.fillStyle = '#5d6b34'; x.fillRect(0, 0, w, h); const r = rng(4);
  for (let i = 0; i < 9000; i++) { x.fillStyle = ['#4e5a2b', '#6d7a3c', '#7a6a3e', '#596a30', '#8a7a48', '#3f4a24'][Math.floor(r() * 6)]; x.globalAlpha = 0.35 + r() * 0.5; x.beginPath(); x.ellipse(r() * w, r() * h, 2 + r() * 9, 1 + r() * 5, r() * 3, 0, 7); x.fill(); }
  x.globalAlpha = 1; for (let i = 0; i < 500; i++) { x.fillStyle = r() < 0.5 ? '#9a6a33' : '#b8823e'; x.save(); x.translate(r() * w, r() * h); x.rotate(r() * 6); x.beginPath(); x.ellipse(0, 0, 7, 3.5, 0, 0, 7); x.fill(); x.restore(); } }, 60);
const forestFloor = add(new THREE.Mesh(new THREE.PlaneGeometry(460, 460).rotateX(-Math.PI / 2), groundP ? std('#d8d2c0', groundP) : std('#ffffff', { map: groundTex })), -20, 0, 0); forestFloor.castShadow = false;
const grassP = await pbr('grass', 120);
const grassTex = canvasTex(512, 512, (x, w, h) => { x.fillStyle = '#5f8a38'; x.fillRect(0, 0, w, h); const r = rng(14); for (let i = 0; i < 6000; i++) { x.fillStyle = ['#4f7a2c', '#6f9a44', '#7da84e', '#557f31'][Math.floor(r() * 4)]; x.globalAlpha = 0.7; x.fillRect(r() * w, r() * h, 2, 5 + r() * 6); } }, 120);
// meadow: a big gently rolling field (vertex-displaced) that starts at the forest edge
const meadowGeo = new THREE.PlaneGeometry(900, 900, 160, 160).rotateX(-Math.PI / 2); { const p = meadowGeo.attributes.position;
  for (let i = 0; i < p.count; i++) { const x = p.getX(i) + 600, z = p.getZ(i); const hill = 34 * Math.exp(-((x - TOWER.x) ** 2 + (z - TOWER.z) ** 2) / 9000); const roll = Math.sin(x * 0.02) * 1.2 + Math.cos(z * 0.025) * 1.0; p.setY(i, x < 175 ? -0.2 : Math.min(1, (x - 175) / 30) * (roll + hill)); }
  meadowGeo.computeVertexNormals(); }
const meadow = add(new THREE.Mesh(meadowGeo, grassP ? std('#c8d6a0', grassP) : std('#ffffff', { map: grassTex })), 600, 0.02, 0); meadow.castShadow = false;
const groundY = (x, z) => { if (x < 175) return 0; const hill = 34 * Math.exp(-((x - TOWER.x) ** 2 + (z - TOWER.z) ** 2) / 9000); return Math.min(1, (x - 175) / 30) * (Math.sin(x * 0.02) * 1.2 + Math.cos(z * 0.025) * 1.0 + hill) + 0.02; };

// ---------- trees ----------
const barkP = await pbr('bark', 2);
const barkTex = canvasTex(128, 512, (x, w, h) => { x.fillStyle = '#6e5a46'; x.fillRect(0, 0, w, h); const r = rng(8); for (let i = 0; i < 260; i++) { x.fillStyle = r() < 0.5 ? '#54432f' : '#8a7660'; x.globalAlpha = 0.6; x.fillRect(r() * w, r() * h, 2 + r() * 5, 14 + r() * 50); } }); barkTex.wrapS = barkTex.wrapT = THREE.RepeatWrapping; barkTex.repeat.set(2, 3);
const barkMat = barkP ? std('#b8aa98', { ...barkP }) : std('#ffffff', { map: barkTex });
if (barkP) for (const k of ['map', 'normalMap', 'roughnessMap']) if (barkP[k]) barkP[k].repeat.set(2, 4);
// leaf clusters: alpha-cut leaf cards in clumps, so the canopy reads as foliage rather than blobs
const leafCard = canvasTex(256, 256, (x, w, h) => { const r = rng(9); for (let i = 0; i < 260; i++) { const cx = w / 2 + (r() - 0.5) * w * 0.85, cy = h / 2 + (r() - 0.5) * h * 0.85; if (Math.hypot(cx - w / 2, cy - h / 2) > w * 0.46) continue;
  x.save(); x.translate(cx, cy); x.rotate(r() * 6.28); x.fillStyle = ['#2f6a27', '#3f8530', '#5a9e3a', '#2a5a22', '#77b04c', '#4a8a2e'][Math.floor(r() * 6)]; x.beginPath(); x.ellipse(0, 0, 13 + r() * 6, 6 + r() * 3, 0, 0, 7); x.fill(); x.strokeStyle = 'rgba(20,50,15,.5)'; x.lineWidth = 1; x.beginPath(); x.moveTo(-12, 0); x.lineTo(12, 0); x.stroke(); x.restore(); } });
const leafMat = new THREE.MeshStandardMaterial({ map: leafCard, alphaTest: 0.5, alphaToCoverage: true, side: THREE.DoubleSide, roughness: 0.8 });
const clumpGeo = (() => { const g = []; for (let i = 0; i < 3; i++) { const p = new THREE.PlaneGeometry(5.2, 5.2); p.rotateY(i * Math.PI / 3); g.push(p); } const p2 = new THREE.PlaneGeometry(5.2, 5.2).rotateX(-Math.PI / 2); g.push(p2);
  const out = new THREE.BufferGeometry(); const pos = [], uv = [], nor = [], idx = []; let o = 0; for (const q of g) { pos.push(...q.attributes.position.array); uv.push(...q.attributes.uv.array); nor.push(...q.attributes.normal.array); idx.push(...Array.from(q.index.array, v => v + o)); o += q.attributes.position.count; }
  out.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); out.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); out.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3)); out.setIndex(idx); return out; })();
const trees = []; { const r = rng(21);
  for (let i = 0; i < 5200; i++) { const x = -230 + r() * 400, z = (r() - 0.5) * 460; if (!inForest(x, z) || nearLoop(x, z, 5.2) || Math.hypot(x - FIRE.x, z - FIRE.z) < 17 || Math.hypot(x - CAMP.x, z - CAMP.z) < 14) continue;
    trees.push({ x, z, s: 0.75 + r() * 0.75, pine: r() < 0.3, rot: r() * 6, lean: (r() - 0.5) * 0.06 }); } }
inst(new THREE.CylinderGeometry(0.2, 0.42, 16, 10, 1).translate(0, 8, 0), barkMat, trees, (d, t) => { d.position.set(t.x, 0, t.z); d.rotation.set(t.lean, t.rot, t.lean); d.scale.set(t.s, t.s * (t.pine ? 1.1 : 1), t.s); });
const beeches = trees.filter(t => !t.pine), pines = trees.filter(t => t.pine);
for (let k = 0; k < 7; k++) { const r = rng(100 + k);
  inst(clumpGeo, leafMat, beeches, (d, t) => { const a = t.rot + k * 0.9 + r(), rad = (k === 0 ? 0 : 1.6 + r() * 1.2) * t.s; d.position.set(t.x + Math.cos(a) * rad, (11 + (k % 3) * 1.6 + r() * 1.5) * t.s, t.z + Math.sin(a) * rad); d.rotation.set(r() * 0.6, r() * 6, r() * 0.6); d.scale.setScalar(t.s * (0.8 + r() * 0.5)); }); }
const needleTex = canvasTex(128, 128, (x, w, h) => { x.fillStyle = '#2b5230'; x.fillRect(0, 0, w, h); const r = rng(19); for (let i = 0; i < 500; i++) { x.strokeStyle = ['#1f4226', '#3a6b3c', '#2f5e34'][Math.floor(r() * 3)]; x.lineWidth = 2; x.beginPath(); const px = r() * w, py = r() * h; x.moveTo(px, py); x.lineTo(px + (r() - 0.5) * 10, py + 8); x.stroke(); } });
const coneGeo = new THREE.ConeGeometry(3, 5, 9, 2, true); { const p = coneGeo.attributes.position, r = rng(23); for (let i = 0; i < p.count; i++) if (p.getY(i) < 2) { const k = 1 + (r() - 0.5) * 0.25; p.setX(i, p.getX(i) * k); p.setZ(i, p.getZ(i) * k); p.setY(i, p.getY(i) + (r() - 0.5) * 0.5); } coneGeo.computeVertexNormals(); }
for (const [k, dy, s2] of [[0, 6.5, 1.2], [1, 9.2, 1.0], [2, 11.8, 0.8], [3, 14.2, 0.58], [4, 16.2, 0.38]])
  inst(coneGeo, std('#ffffff', { map: needleTex, side: THREE.DoubleSide }), pines, (d, t) => { d.position.set(t.x, dy * t.s * 1.1, t.z); d.rotation.set(0, t.rot + k, 0); d.scale.setScalar(s2 * t.s); });

// undergrowth: Poly Haven plant models if present, plus fern cards and bushes
const fernTex = canvasTex(256, 256, (x, w, h) => { x.translate(w / 2, h); const r = rng(5);
  for (let f = 0; f < 7; f++) { x.save(); x.rotate((f - 3) * 0.32); x.strokeStyle = '#3d7a2c'; x.lineWidth = 4; x.beginPath(); x.moveTo(0, 0); x.quadraticCurveTo(10, -120, 0, -230); x.stroke();
    for (let y = -20; y > -220; y -= 12) { const L = 46 * (1 - Math.abs(y + 110) / 140); x.fillStyle = r() < 0.5 ? '#4d9136' : '#3f8030'; for (const s of [-1, 1]) { x.beginPath(); x.ellipse(s * L / 2, y, L / 2, 5, s * 0.3, 0, 7); x.fill(); } } x.restore(); } });
const fernMat = new THREE.MeshStandardMaterial({ map: fernTex, alphaTest: 0.5, alphaToCoverage: true, side: THREE.DoubleSide, roughness: 0.9 });
const fernGeo = new THREE.PlaneGeometry(1.6, 1.6).translate(0, 0.8, 0), fernGeo2 = fernGeo.clone().rotateY(Math.PI / 2);

function card(kind, w = CW, h = CH, ch = CARD_H) { const c = document.createElement('canvas'); c.width = w; c.height = h; const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const geo = new THREE.PlaneGeometry(ch * w / h, ch); geo.translate(0, ch / 2, 0);
  const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.4, side: THREE.DoubleSide })); m.castShadow = true; scene.add(m);
  const sh = new THREE.Mesh(new THREE.PlaneGeometry(1.3 * ch / CARD_H, 0.5 * ch / CARD_H).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false })); scene.add(sh);
  const P = { kind, m, sh, ctx: c.getContext('2d'), tex, last: '', w, h, seed: people.length * 1.37 }; people.push(P); return P; }
// place() records where/how; finishPeople() faces the camera and draws once the shot has set the camera.
function place(P, pos, pose, expr, t, vel, opts = {}) { P.m.visible = P.sh.visible = true; P.m.position.copy(pos); P.sh.position.set(pos.x, pos.y + 0.03, pos.z); P.pend = { pose, expr, t, vel, opts }; }
function finishPeople() { for (const P of people) { if (!P.m.visible || !P.pend) continue; const { pose, expr, t, vel, opts } = P.pend, pos = P.m.position;
  P.m.rotation.set(0, Math.atan2(cam.position.x - pos.x, cam.position.z - pos.z), 0);
  const o = { ...opts }; if (vel && vel.lengthSq() > 1e-6) { const right = V(1, 0, 0).applyQuaternion(cam.quaternion), toCam = cam.position.clone().sub(pos).setY(0).normalize(), v = vel.clone().setY(0).normalize();
    if (o.back == null) o.back = v.dot(toCam) < -0.45;              // walking away from us: show his back
    o.flip = v.dot(right) < 0; if (o.turn == null && !o.back) o.turn = clamp(v.dot(right) * 26, -26, 26); }
  const pt = Math.round(t * 30) / 30, key = [pose, expr, pt, o.flip, o.back, o.turn, o.lines, o.blind].join('|');
  if (key !== P.last) { if (P.draw) P.draw(P.ctx, P.w, P.h, pose, pt, o); else drawPerson(P.ctx, CW, CH, P.kind, pose, expr, pt, P.seed, o); P.tex.needsUpdate = true; P.last = key; } } }
