const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));

// ---------- time: hook (cold open) -> 0.8 s rewind -> story ----------

const toVid = v => v < HOOK_END ? v : v + RW;

const C = {}; for (const [k, a] of Object.entries(CUES)) if (k[0] !== '_') C[k] = toVid(VTw(a[0], a[1], a[2]) + a[3]);

// ---------- renderer + post ----------
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, preserveDrawingBuffer: true });

`;

const skyU = { uTime: { value: 0 }, uStorm: { value: 0 }, uSunset: { value: 0 }, uFlash: { value: 0 }, uSun: { value: V(-0.5, 0.6, -0.4).normalize() } };

{ const g = new THREE.PlaneGeometry(900, 240, 300, 120).rotateX(-Math.PI / 2); g.translate(0, 0, -60); const p = g.attributes.position, col = [];

    float shore = (1.0 - smoothstep(0.0, 1.6 + uStorm * 2.0, vWP.z - swash)) * smoothstep(-0.3, 0.3, vWP.z - swash + 1.8);

    float foam = clamp(crest * (0.6 + uStorm) + shore * lace * 1.2 + (1.0 - smoothstep(0.0, 3.5, dz)) * 0.35 * lace, 0.0, 1.0);
    col += vec3(0.05, 0.12, 0.1) * smoothstep(0.2, 1.4, vH) * (1.0 - uStorm);
    diffuseColor.rgb = mix(col, vec3(0.97, 0.98, 0.97), foam);
    diffuseColor.a = mix(0.55, 1.0, smoothstep(-0.5, 7.0, dz)) + foam * 0.4;`); };
const sea = new THREE.Mesh(new THREE.PlaneGeometry(700, 500, 400, 280).rotateX(-Math.PI / 2).translate(0, 0, 250), seaMat); sea.receiveShadow = true; sea.frustumCulled = false; scene.add(sea);
const seaFar = new THREE.Mesh(new THREE.PlaneGeometry(5000, 3000, 60, 40).rotateX(-Math.PI / 2).translate(0, -0.6, 1400), seaMat); seaFar.frustumCulled = false; scene.add(seaFar);

// ---------- palms ----------
const trunkTex = canvasTex(64, 512, (x, w, h) => { x.fillStyle = '#9a7a52'; x.fillRect(0, 0, w, h); for (let y = 0; y < h; y += 22) { x.fillStyle = '#6e5232'; x.fillRect(0, y, w, 6); x.fillStyle = '#b8966a'; x.fillRect(0, y + 6, w, 3); } const r = rng(3); for (let i = 0; i < 300; i++) { x.fillStyle = 'rgba(60,40,20,.25)'; x.fillRect(r() * w, r() * h, 2, 8); } });

const frondTex = canvasTex(256, 1024, (x, w, h) => { x.strokeStyle = '#4f7a2a'; x.lineWidth = 10; x.beginPath(); x.moveTo(w / 2, h); x.lineTo(w / 2, 0); x.stroke(); const r = rng(9);
  for (let y = h - 30; y > 10; y -= 15) { const L = (w / 2 - 8) * Math.sin(Math.PI * (1 - y / h)) ** 0.6; for (const s of [-1, 1]) { x.fillStyle = ['#3f8a2e', '#4f9c34', '#2f7426', '#5aa83a'][Math.floor(r() * 4)]; x.beginPath(); x.moveTo(w / 2, y); x.quadraticCurveTo(w / 2 + s * L * 0.5, y - 26, w / 2 + s * L, y - 44 - r() * 10); x.quadraticCurveTo(w / 2 + s * L * 0.5, y - 14, w / 2, y + 6); x.fill(); } } });

function frondGeo(L, Wd, droop) { const g = new THREE.PlaneGeometry(Wd, L, 1, 12); g.translate(0, L / 2, 0); const p = g.attributes.position; for (let i = 0; i < p.count; i++) { const y = p.getY(i), k = y / L; p.setZ(i, -droop * k * k * L); p.setY(i, y * (1 - 0.25 * k * droop)); p.setX(i, p.getX(i) * (0.4 + 0.6 * Math.sin(Math.PI * Math.min(1, k * 1.15 + 0.05)))); } g.rotateX(-Math.PI / 2); g.computeVertexNormals(); return g; }

const palms = [];
function palm(x, z, hgt, lean, rot, seed) { const r = rng(seed); const base = V(x, sandH(x, z) - 0.1, z); const dir = V(Math.cos(rot), 0, Math.sin(rot));
