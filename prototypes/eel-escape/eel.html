S.sort((a, b) => a.at - b.at);
tGone = WT('gulp', 'gone'); tOut = WT('free', 'out');
const shotAt = t => { let i = 0; for (let k = 0; k < S.length; k++) if (t >= S[k].at) i = k; return i; };

// ---------- stats overlay (32 eels, 13 tails out, 9 escaped) ----------
const sc = document.getElementById('stats'), sx = sc.getContext('2d');
function drawStats(t) { sc.style.display = 'block'; sx.clearRect(0, 0, W, H); const t0 = BS('stats'), t13 = WT('stats', 'thirteen'), t9 = WT('stats', 'nine'), t56 = WT('stats', 'fifty-six');
  sx.fillStyle = 'rgba(4,8,14,0.55)'; sx.fillRect(0, 0, W, H);
  const cols = 4, cw = 230, ch = 150, x0 = (W - cols * cw) / 2 + cw / 2, y0 = 470;
  for (let i = 0; i < 32; i++) { const a = clamp((t - t0 - i * 0.035) * 6); if (a <= 0) continue; const cx = x0 + (i % cols) * cw, cy = y0 + Math.floor(i / cols) * ch * 0.62;
    const tail = i < 13 && t > t13 + i * 0.04, esc = i < 9 && t > t9 + i * 0.05; sx.save(); sx.translate(cx, cy); sx.scale(a, a);
    sx.lineCap = 'round'; sx.lineWidth = 22; sx.strokeStyle = '#111'; sx.beginPath(); const w = Math.sin(t * 8 + i) * 8; sx.moveTo(-70, 0); sx.bezierCurveTo(-30, -20 + w, 20, 20 - w, 70, 0); sx.stroke();
    sx.lineWidth = 13; sx.strokeStyle = esc ? '#5fe07a' : tail ? '#ffd23a' : '#d9e6f2'; sx.stroke(); sx.fillStyle = '#111'; sx.beginPath(); sx.arc(62, -4, 4, 0, 7); sx.fill(); sx.restore(); }
  sx.textAlign = 'center'; sx.font = '800 64px Poppins'; sx.lineWidth = 12; sx.strokeStyle = '#111';
  const lab = (txt, y, c, a) => { if (a <= 0) return; sx.globalAlpha = a; sx.fillStyle = c; sx.strokeText(txt, W / 2, y); sx.fillText(txt, W / 2, y); sx.globalAlpha = 1; };
  lab('32 SWALLOWED', 400, '#ffffff', clamp((t - t0) * 4)); lab('13 TAILS OUT', 1120 + 0, '#ffd23a', clamp((t - t13) * 4)); lab('9 ESCAPED', 1050 - 0 + 160, '#5fe07a', clamp((t - t9) * 4));
  if (t > t56) { const a = clamp((t - t56) * 5); sx.save(); sx.translate(W / 2, 1440); sx.scale(0.7 + 0.3 * a, 0.7 + 0.3 * a); sx.font = '800 150px Poppins'; sx.lineWidth = 20; sx.fillStyle = '#ffd23a'; sx.strokeText('0:56', 0, 0); sx.fillText('0:56', 0, 0); sx.font = '800 46px Poppins'; sx.lineWidth = 10; sx.fillStyle = '#fff'; sx.strokeText('AVERAGE ESCAPE', 0, 70); sx.fillText('AVERAGE ESCAPE', 0, 70); sx.restore(); } }

// ---------- captions ----------
const capEl = document.querySelector('#cap span'), labEl = document.getElementById('label');
const KEY = /^(EATEN|ALIVE|GILLS|GILL|ESCAPE|ESCAPED|SLEEPER|WHOLE|GONE|STOMACH|MINUTES|X-RAY|CIRCLES|BACKWARDS|TAIL|TAILS|OUT|NINE|THIRTEEN|THIRTY-TWO|FIFTY-SIX|ONLY|EVER|NAGASAKI)$/;
function captions(t) { let wi = -1; for (let i = 0; i < WORDS.length; i++) if (WORDS[i].s <= t + 0.14) wi = i; const wd = WORDS[wi];
  if (!wd || t > wd.e + 0.3) { capEl.textContent = ''; return; }
  const txt = wd.w.replace(/[.,?!]/g, '').toUpperCase(); capEl.textContent = txt; capEl.className = wd.speaker && wd.speaker !== 'narrator' ? 'r' : KEY.test(txt) ? 'k' : '';
  const a = clamp((t + 0.14 - wd.s) / 0.06); capEl.style.transform = `scale(${0.82 + 0.18 * a + 0.05 * Math.sin(a * Math.PI)})`; }

window.renderFrame = (t) => {

    xrayLook(xcam, V(0.15, 0.3, 2.3), V(0.15, -0.08, 0), 34); renderer.setRenderTarget(RT); renderer.toneMappingExposure = 1.3; renderer.render(scene, xcam); renderer.setRenderTarget(null); renderer.toneMappingExposure = 1.05;
    [RIVER.visible, STOM.visible, LAB.visible, XR.visible] = was; scene.background = bg; scene.fog = fog; }
  captions(t); labEl.innerHTML = sh.label && u < 1.6 ? sh.label : ''; if (sh.label) { const a = clamp(u / 0.12); labEl.style.transform = `scale(${0.7 + 0.3 * a}) rotate(-2deg)`; labEl.style.opacity = clamp((1.6 - u) * 6); }
  if (STATS || si === S.findIndex(x => x.at === BS('stats'))) drawStats(t);
  document.getElementById('rw').style.display = sh.rewind ? 'block' : 'none';
  // flashes: at the cut (sh.flash === true) or on listed times
  let fl = 0; if (sh.flash === true) fl = Math.max(0, 0.55 - u * 4); if (Array.isArray(sh.flash)) for (const ft of sh.flash) if (t >= ft) fl = Math.max(fl, 0.6 - (t - ft) * 4);
  if (sh.dark) fl = 0; document.getElementById('flash').style.opacity = fl; document.getElementById('flash').style.background = '#fff';
  if (sh.dark) { const k = ease(BE('gulp') - 0.35, BE('gulp'), t); document.getElementById('flash').style.background = '#000'; document.getElementById('flash').style.opacity = k; }
  if (window.CAMO) { cam.position.copy(window.CAMO[0]); cam.lookAt(window.CAMO[1]); cam.fov = window.CAMO[2] || 45; cam.updateProjectionMatrix(); bokeh.enabled = false; }

};
