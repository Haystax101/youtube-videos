<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Paper cut-out style (script.json "style": "paper"). Everything is drawn by web/paper.js on one 2D canvas. -->
<style>
  @font-face { font-family: "Permanent Marker"; font-weight: 400; src: url("/web/paper/fonts/permanent-marker-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Patrick Hand"; font-weight: 400; src: url("/web/paper/fonts/patrick-hand-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Fredoka"; font-weight: 700; src: url("/node_modules/@fontsource/fredoka/files/fredoka-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family: "Special Elite"; font-weight: 400; src: url("/node_modules/@fontsource/special-elite/files/special-elite-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Anton"; font-weight: 400; src: url("/node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2") format("woff2"); }
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #e9dcc3; }
  #c { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1080" height="1920"></canvas></div>
<script type="module" src="/web/paper.js"></script>
</body>
</html>
