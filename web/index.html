<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Fredoka"; font-weight: 700; src: url("/node_modules/@fontsource/fredoka/files/fredoka-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family: "Fredoka"; font-weight: 600; src: url("/node_modules/@fontsource/fredoka/files/fredoka-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "Special Elite"; font-weight: 400; src: url("/node_modules/@fontsource/special-elite/files/special-elite-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Anton"; font-weight: 400; src: url("/node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2") format("woff2"); }
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Fredoka", sans-serif; }
  #gl { position: absolute; inset: 0; }
  #vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.35) 100%); }
  .outlined { color: #fff; -webkit-text-stroke: 18px #111; paint-order: stroke fill; }
  #caption { position: absolute; left: 60px; right: 60px; top: 1180px; text-align: center;
    font-size: 118px; font-weight: 700; line-height: 1.05; letter-spacing: 1px; transform-origin: 50% 60%; }
  #caption.gary { color: #ffd23f; }
  #label { position: absolute; left: 0; right: 0; top: 250px; text-align: center; font-size: 150px; font-weight: 700;
    transform-origin: 50% 50%; }
  #label.hook { top: 230px; padding: 0 50px; font-size: 112px; line-height: 1.04; color: #ffd23f; }
  #label .hot { color: #ff4a4a; }
  #counter { position: absolute; left: 50%; top: 110px; transform: translateX(-50%); background: #fff; border: 8px solid #111;
    border-radius: 60px; padding: 8px 40px 12px; font-size: 64px; font-weight: 700; color: #111; white-space: nowrap;
    box-shadow: 0 10px 0 #111; transform-origin: 50% 50%; }
  #counter b { color: #e23b3b; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #redflash { position: absolute; inset: 0; background: #e23b3b; opacity: 0; pointer-events: none; mix-blend-mode: multiply; }
  #card { position: absolute; inset: 0; opacity: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(20,16,40,0.55); text-align: center; padding: 0 80px; }
  #cardTitle { font-size: 150px; font-weight: 700; color: #ffd23f; line-height: 1.05; }
  #cardSub { font-size: 84px; font-weight: 700; margin-top: 30px; line-height: 1.1; }
  body.landscape #caption { top: auto; bottom: 90px; left: 160px; right: 160px; font-size: 92px; -webkit-text-stroke: 14px #111; }
  body.landscape #label { top: 70px; font-size: 110px; }
  body.landscape #label.hook { top: 60px; font-size: 96px; padding: 0 200px; }
  body.landscape #counter { left: auto; right: 50px; top: 40px; transform: none; font-size: 48px; transform-origin: 100% 0; }
  body.landscape #cardTitle { font-size: 140px; }
  body.landscape #cardSub { font-size: 72px; }
  /* ---- styles: script.json "style" ("cartoon" default, "noir", "news") ---- */
  #grain, #blinds, #ticker, #live, #lower { position: absolute; pointer-events: none; display: none; }
  #grain { inset: 0; mix-blend-mode: overlay; opacity: 0.55; }
  #blinds { inset: -200px; transform: rotate(-14deg); opacity: 0.32;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0) 0 70px, rgba(0,0,0,0.95) 70px 118px); }
  body.style-noir #gl { filter: grayscale(1) contrast(1.45) brightness(0.86); }
  body.style-noir #grain, body.style-noir #blinds { display: block; }
  body.style-noir #vignette { background: radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 30%, rgba(0,0,0,0.88) 100%); }
  body.style-noir .outlined { -webkit-text-stroke: 0; }
  body.style-noir #caption { font-family: "Special Elite", monospace; font-size: 86px; font-weight: 400; color: #f2efe6;
    top: 1150px; left: 90px; right: 90px; text-align: left; line-height: 1.2; }
  body.style-noir #caption span.box { background: rgba(0,0,0,0.88); padding: 4px 18px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  body.style-noir #caption.gary { color: #fff; font-style: italic; }
  body.style-noir #label { font-family: "Special Elite", monospace; font-weight: 400; font-size: 110px; color: #f2efe6;
    text-shadow: 0 0 30px rgba(0,0,0,0.9), 0 6px 0 #000; letter-spacing: 6px; }
  body.style-noir #label.hook { font-size: 100px; color: #f2efe6; }
  body.style-noir #label .hot { color: #e11d1d; }
  body.style-noir #counter { font-family: "Special Elite", monospace; font-weight: 400; background: #f2efe6; border-color: #000; box-shadow: none; border-radius: 4px; }
  body.style-noir #counter b { color: #c11; }

  body.style-news #ticker, body.style-news #live, body.style-news #lower { display: block; }
  body.style-news #caption { font-family: "Anton", sans-serif; font-weight: 400; font-size: 120px; text-transform: uppercase;
    top: 1020px; letter-spacing: 2px; -webkit-text-stroke: 16px #111; }
  body.style-news #caption .w { display: inline-block; padding: 0 12px; border-radius: 14px; }
  body.style-news #caption .w.on { background: #ffd23f; color: #111; -webkit-text-stroke: 0; }
  body.style-news #caption.gary .w { color: #9fe3ff; } body.style-news #caption.gary .w.on { color: #111; background: #9fe3ff; }
  body.style-news #label { display: none; }
  body.style-news #label.hook { display: block; font-family: "Anton", sans-serif; font-weight: 400; font-size: 120px; color: #fff; text-transform: uppercase; top: 300px; }
  body.style-news #counter { font-family: "Anton", sans-serif; font-weight: 400; border-radius: 6px; background: #fff; box-shadow: 0 8px 0 #111; }
  #lower { left: 40px; right: 40px; top: 1330px; height: 150px; font-family: "Anton", sans-serif; text-transform: uppercase;
    transform-origin: 0 50%; }
  #lower .tag { position: absolute; left: 0; top: 0; height: 150px; width: 300px; background: #d7141a; color: #fff; font-size: 64px;
    display: flex; align-items: center; justify-content: center; border: 6px solid #111; box-sizing: border-box; }
  #lower .txt { position: absolute; left: 294px; right: 0; top: 0; height: 150px; background: #fff; color: #111; font-size: 92px;
    display: flex; align-items: center; padding-left: 34px; border: 6px solid #111; box-sizing: border-box; white-space: nowrap; overflow: hidden; }
  #lower .txt .hot { color: #d7141a; }
  #ticker { left: 40px; right: 40px; top: 1480px; height: 78px; background: #111; color: #ffd23f; overflow: hidden;
    font-family: "Anton", sans-serif; font-size: 50px; line-height: 78px; white-space: nowrap; border: 6px solid #111; border-top: 0; box-sizing: content-box; }
  #ticker span { position: absolute; left: 0; top: 0; padding-left: 20px; }
  #live { left: 40px; top: 100px; background: #d7141a; color: #fff; font-family: "Anton", sans-serif; font-size: 58px;
    padding: 4px 26px 8px; border: 6px solid #111; }
</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js" } }</script>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div id="blinds"></div>
  <div id="vignette"></div>
  <canvas id="grain" width="540" height="960"></canvas>
  <div id="live">● LIVE</div>
  <div id="lower"><div class="tag">BREAKING</div><div class="txt"></div></div>
  <div id="ticker"><span></span></div>
  <div id="redflash"></div>
  <div id="flash"></div>
  <div id="counter" class="">TIMES DIED: <b id="deaths">0</b></div>
  <div id="label" class="outlined"></div>
  <div id="caption" class="outlined"></div>
  <div id="card"><div id="cardTitle" class="outlined"></div><div id="cardSub" class="outlined"></div></div>
</div>
<script type="module" src="/web/scene.js"></script>
</body>
</html>
