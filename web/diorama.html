<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- "diorama" style (long-form, landscape): soft-lit miniature island sets with depth of field,
     a smoother Gary, and flat 2D infographic inserts. Renderer: web/diorama.js -->
<style>
  @font-face { font-family: "Poppins"; font-weight: 600; src: url("/node_modules/@fontsource/poppins/files/poppins-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "Poppins"; font-weight: 800; src: url("/node_modules/@fontsource/poppins/files/poppins-latin-800-normal.woff2") format("woff2"); }
  @font-face { font-family: "Fredoka"; font-weight: 600; src: url("/node_modules/@fontsource/fredoka/files/fredoka-latin-600-normal.woff2") format("woff2"); }
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: "Poppins", sans-serif; background: #1d2340; }
  #gl, #ins { position: absolute; inset: 0; }
  #ins { opacity: 0; }
  #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 62%, rgba(20,10,30,0.35) 100%); }
  #fade { position: absolute; inset: 0; background: #0e0f1c; opacity: 0; pointer-events: none; }
  #label { position: absolute; left: 80px; top: 64px; font: 600 44px Fredoka; color: #3b2a1e; background: #fff7ea; padding: 8px 32px 10px;
    border-radius: 40px; box-shadow: 0 10px 28px rgba(40,20,10,.28); transform-origin: 0 50%; letter-spacing: 1px; }
  #label .hot { color: #e2513a; }
  #sub { position: absolute; left: 0; right: 0; bottom: 64px; text-align: center; }
  #sub span { display: inline-block; max-width: 1500px; font: 600 42px Poppins; line-height: 1.25; color: #fff; background: rgba(18,16,32,0.62);
    padding: 10px 28px 12px; border-radius: 18px; }
  #card { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0;
    background: radial-gradient(ellipse at 50% 50%, rgba(16,14,34,0.55) 0%, rgba(16,14,34,0.82) 100%); }
  #card .t { font: 600 40px Poppins; letter-spacing: 10px; color: #ffb27a; }
  #card .s { font: 600 132px Fredoka; color: #fff7ea; margin-top: 6px; text-shadow: 0 8px 40px rgba(0,0,0,.45); }
  #card .bar { width: 140px; height: 6px; border-radius: 3px; background: #ffb27a; margin-top: 22px; transform-origin: 50% 50%; }
  #title { position: absolute; left: 0; right: 0; top: 380px; text-align: center; font: 600 112px Fredoka; color: #fff7ea; opacity: 0;
    text-shadow: 0 6px 0 rgba(60,20,20,.35), 0 10px 40px rgba(0,0,0,.5); }
</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }</script>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1920" height="1080"></canvas>
  <div id="vignette"></div>
  <canvas id="ins" width="1920" height="1080"></canvas>
  <div id="card"><div class="t"></div><div class="s"></div><div class="bar"></div></div>
  <div id="title"></div>
  <div id="label"></div>
  <div id="sub"><span></span></div>
  <div id="fade"></div>
</div>
<script type="module" src="/web/diorama.js"></script>
</body>
</html>
