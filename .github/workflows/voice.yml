name: Voice with Qwen3-TTS

# Voices an episode with designed Qwen3-TTS voices (tools/qwen_voice.py) on a GitHub runner and
# publishes voice.wav, timeline.json and the voice references to a pre-release
# (tag voice-<slug>-<run id>). Start it by writing the episode folder into voice-request.txt
# and pushing (any branch).
on:
  push:
    paths: [voice-request.txt]
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode folder"
        required: true

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pick episode
        env:
          INPUT_EP: ${{ inputs.episode }}
        run: |
          EP="${INPUT_EP:-$(head -n1 voice-request.txt | tr -d '[:space:]')}"
          case "$EP" in episodes/*|prototypes/*) ;; *) echo "bad episode path: $EP"; exit 1 ;; esac
          case "$EP" in *..*) echo "bad episode path: $EP"; exit 1 ;; esac
          test -f "$EP/script.json"
          echo "EP=$EP" >> "$GITHUB_ENV"
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen3-tts-1.7b-v1
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sox libsox-dev ffmpeg
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          pip install -U qwen-tts soundfile librosa
      - name: Voice
        run: python3 tools/qwen_voice.py "$EP"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="$(basename "$EP")"; TAG="voice-$NAME-${{ github.run_id }}"
          tar -cf voices.tar -C "$EP" voices
          gh release create "$TAG" "$EP/voice.wav" "$EP/timeline.json" voices.tar --prerelease \
            --title "Voice: $NAME" --notes "Qwen3-TTS voices, run ${{ github.run_id }}" --target "${{ github.sha }}"
