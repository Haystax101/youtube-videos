name: Render episode

# Renders one episode (voice, mix, frames, MP4) on a GitHub runner and uploads the
# video as an artifact. Used for long-form videos, which take too long to render
# inside the daily Claude session. The weekly run starts it by writing the episode
# folder into render-request.txt and pushing (george can also start it from the
# Actions tab).
on:
  push:
    branches: [main]
    paths: [render-request.txt]
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode folder, e.g. episodes/long/001-life-on-another-planet"
        required: true

permissions:
  contents: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Pick episode
        env:
          INPUT_EP: ${{ inputs.episode }}
        run: |
          EP="${INPUT_EP:-$(head -n1 render-request.txt | tr -d '[:space:]')}"
          case "$EP" in episodes/*) ;; *) echo "bad episode path: $EP"; exit 1 ;; esac
          test -f "$EP/script.json"
          echo "EP=$EP" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Kokoro model
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ./setup.sh
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Voice and mix
        run: |
          python3 pipeline/tts.py "$EP"
          python3 pipeline/mix.py "$EP"

      - name: Render
        run: node pipeline/render.mjs "$EP" --workers 4

      - name: Name artifact
        id: name
        run: echo "name=$(basename "$EP")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: |
            ${{ env.EP }}/video.mp4
            ${{ env.EP }}/timeline.json
          retention-days: 14

      # Claude sessions can't reach the artifact storage host, so also attach the
      # video to a pre-release they can download from.
      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="render-${{ steps.name.outputs.name }}-${{ github.run_id }}"
          gh release create "$TAG" "$EP/video.mp4" "$EP/timeline.json" --prerelease \
            --title "Render: ${{ steps.name.outputs.name }}" --notes "Rendered by run ${{ github.run_id }}" --target "${{ github.sha }}"
