name: Fetch CC0 sound effects

# Downloads recorded CC0 sound effects (Freesound CC0 previews, Kenney, OpenGameArt; Wikimedia Commons
# with SFX_COMMONS=1) for the keywords in sfx-keywords.txt with tools/fetch_sfx.py, split over 6 runners,
# and publishes sfx.tar + sfx-manifest.json on the release "sfx-v1" (untar into the repo root: files
# land in assets/sfx/<folder>/*.wav). Start it by changing sfx-keywords.txt and pushing (any branch).
on:
  push:
    paths: [sfx-keywords.txt]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sfx-v1

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Fetch
        timeout-minutes: 75
        continue-on-error: true
        env:
          SFX_SHARD: ${{ matrix.shard }}/6
        run: python3 tools/fetch_sfx.py assets/sfx
      - uses: actions/upload-artifact@v4
        with:
          name: sfx-${{ matrix.shard }}
          path: assets/sfx
          if-no-files-found: ignore

  publish:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - name: Merge and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p assets/sfx
          python3 - <<'PY'
          import glob, json, os, shutil
          man = []
          for d in sorted(glob.glob('parts/sfx-*')):
              for root, _, files in os.walk(d):
                  for f in files:
                      src = os.path.join(root, f); rel = os.path.relpath(src, d)
                      if f == 'manifest.json': man += json.load(open(src)); continue
                      os.makedirs(os.path.dirname(os.path.join('assets/sfx', rel)), exist_ok=True)
                      shutil.copy(src, os.path.join('assets/sfx', rel))
          json.dump(man, open('assets/sfx/manifest.json', 'w'), indent=1)
          print(len(man), 'files in manifest')
          PY
          tar -cf sfx.tar assets/sfx
          ls -la sfx.tar
          TAG="sfx-v1"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --title "CC0 sound effects" --notes "CC0 sound effects fetched by tools/fetch_sfx.py; see sfx-manifest.json for each file's source and licence." --target "${{ github.event.repository.default_branch }}"
          cp assets/sfx/manifest.json sfx-manifest.json
          gh release upload "$TAG" sfx.tar sfx-manifest.json --clobber
