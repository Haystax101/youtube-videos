const CLERK = { name: 'Clerk', hair: 'side', hairColor: '#1e1816', outfit: 'shirt', color: '#e9eef2', tie: '#2b4f8a', legs: '#2f3440', glasses: true, id: 101 };

const STAFF = (i) => ({ name: 'Staff' + i, hair: ['short', 'side', 'long', 'buzz', 'short'][i % 5], hairColor: '#1e1816', outfit: ['shirt', 'suit', 'tee', 'shirt', 'suit'][i % 5], color: ['#d9e2ea', '#3a4150', '#b8584a', '#e7dcc4', '#2f3a4a'][i % 5], legs: ['#2f3440', '#2a2b33', '#3a2f45', '#4a4238', '#24262d'][i % 5], tie: i % 5 === 1 ? '#7a2b2b' : undefined, id: 110 + i });
const walkTo = (L, t0, d, x0, x1) => { const w = clamp((L - t0) / d); return { x: lerp(x0, x1, ease(w)), walk: w > 0 && w < 1 ? w * d * 2.2 : 0, face: x1 > x0 ? 1 : -1, moving: w > 0 && w < 1 }; };

const DEGUITO = { name: 'Deguito', hair: 'long', hairColor: '#2a1c16', outfit: 'suit', color: '#6b2f3a', legs: '#2a2b33', id: 131 };
const PARK = { name: 'Park', hair: 'buzz', hairColor: '#141414', outfit: 'shirt', color: '#3b4a63', legs: '#2a2b33', glasses: true, id: 132 };
const KIM = { name: 'Kim', hair: 'short', hairColor: '#2a2a2a', outfit: 'suit', color: '#1f1f24', tie: '#c7342a', legs: '#1f1f24', id: 133 };
const classroom = (ctx, t, L) => room(ctx, t, { wall: '#d6cfb8', wall2: '#8a7a5a', floor: '#5d4330', wainscot: 640, items: c => {
  rr(c, 560, 140, 800, 380, 8); fillStroke(c, '#5a4030', INK, 5); rr(c, 580, 160, 760, 340, 4); fillStroke(c, '#2f4a3a', INK, 3);
  c.save(); c.fillStyle = 'rgba(240,240,230,.9)'; c.font = '64px "Caveat"'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('HACKING 101', 960, 240);
  c.font = '44px "Caveat"'; const ln = ['1. get inside', '2. stay quiet', '3. take the money']; ln.forEach((s, i) => { const n = Math.floor(clamp((L - 0.4 - i * 0.6) / 0.5) * s.length); c.fillText(s.slice(0, n), 960, 320 + i * 56); }); c.restore();
  } });
const DHAKA = [90.41, 23.81], NYC = [-74.0, 40.71], MANILA = [120.98, 14.6], COLOMBO = [79.86, 6.93];
const BANKS = [[-0.12, 51.5], [139.7, 35.7], [8.68, 50.11], [103.8, 1.35], [55.3, 25.2], [-46.6, -23.5], [151.2, -33.9], [2.35, 48.85], [114.2, 22.3], [-79.4, 43.7]];

const { boot } = await import('/prototypes/casefile2d/runtime.js');
await boot(new URL('./', location.href).href, ({ cue, end, tl }) => {
  const B = (b, w = 0) => cue(b, w);

  const S = [];
  const add = (t0, name, draw, overlay, dark = 0.08) => S.push({ t0, name, draw, overlay, dark });

  // ================= COLD OPEN (a new setup every 3-4 s) =================
  // 1. the world spins into Dhaka
  add(0, 'map to dhaka', (ctx, t, k, L) => { const z = easeInOut(clamp(L / 3.0));

    (ctx, t, k, L) => { caption(ctx, 'OVERNIGHT', W / 2, 150, t - B(3, 'overnight'), 1.8, { size: 84 }); caption(ctx, "THE BANK'S OWN COMPUTERS", W / 2, 150, t - B(3, 'own'), 2.0, { size: 60 }); }, 0.1);
  // 12. New York
  add(B(3, 'asked') - 0.1, 'new york fed', (ctx, t, k, L) => { camera(ctx, { x: 960, y: 500, z: 1.0 }, { x: 960, y: 520, z: 1.12 }, k); fedBuilding(ctx, t); },
    (ctx, t, k, L) => { dateTag(ctx, 'NEW YORK', L - 0.1); caption(ctx, 'FEDERAL RESERVE\nBANK OF NEW YORK', W / 2, 150, t - B(3, 'federal'), 2.2, { size: 64 }); }, 0.08);
  // 13. almost a billion dollars
  add(B(3, 'almost') - 0.15, 'counter', (ctx, t, k, L) => { const [sx, sy] = shake(t, B(3, 'almost') + 1.8, 8, 0.4); camera(ctx, { x: 960 + sx, y: 540 + sy, z: 1.0 }, { x: 960 + sx, y: 540 + sy, z: 1.06 }, k);
    moneyCounter(ctx, t, L, { to: 951000000, dur: 1.8, label: 'SEND' }); }, null, 0.04);
  // 14. to strangers on the other side of the world
  add(B(3, 'strangers') - 0.15, 'routes to asia', (ctx, t, k, L) => { mapInsert(ctx, t, { view: { lon: lerp(-10, 30, k), lat: 25, span: 320 }, local: L, highlight: { Bangladesh: '#d98b4a', 'United States of America': '#7fa3a6', Philippines: '#c9a24a', 'Sri Lanka': '#c9a24a' },
    routes: [{ from: DHAKA, to: NYC, at: 0, dur: 0.6 }, { from: NYC, to: MANILA, at: 0.5, dur: 1.0 }, { from: NYC, to: COLOMBO, at: 0.8, dur: 1.0 }],

    (ctx, t, k, L) => { caption(ctx, 'TO STRANGERS', W / 2, 150, L - 0.3, 2.0); }, 0.04);
  // 15. the printer did not break by accident
  add(B(4, 0) - 0.05, 'printer accident', (ctx, t, k, L) => { camera(ctx, { x: 1380, y: 520, z: 2.2 }, { x: 1400, y: 470, z: 3.2 }, k);
    officeFloor(ctx, t, { desks: [420], printerX: 1380, printer: { error: true, paper: 0.6, jam: true }, dark: 0.45, night: true }); glowSpot(ctx, 1493, 460, 260, 'rgba(255,40,30,.25)'); },

  // 16. one of the most ambitious robberies ever
  add(B(5, 0) - 0.05, 'headline', (ctx, t, k, L) => { newspaper(ctx, t, { local: L, paper: 'THE DAILY RECORD', date: 'MARCH 2016', headline: 'HACKERS TRY TO\nSTEAL $1 BILLION' }); }, null, 0.04);

  add(B(5, 'thieves') - 0.1, 'no door vault gun', (ctx, t, k, L) => { const o = B(5, 'thieves') - 0.1; iconsCrossed(ctx, t, L, [B(5, 'door') - o, B(5, 'vault') - o, B(5, 'gun') - o]); }, null, 0.04);

  add(B(5, 'they') - 0.1, 'planned a year', (ctx, t, k, L) => { camera(ctx, { x: 960, y: 540, z: 1.0 }, { x: 960, y: 540, z: 1.08 }, k);

      { label: 'GOT AWAY WITH', value: 81, at: B(5, 'less') - B(5, 'yet') + 0.3, color: RED, show: p => '$' + Math.round(81 * p) + 'M' }] }); },

  add(B(6, 0) - 0.1, 'why fail board', (ctx, t, k, L) => { camera(ctx, { x: 960, y: 540, z: 1.0 }, { x: 960, y: 560, z: 1.07 }, k);

  const hl = (L, at) => clamp((L - at) / 0.4);

  add(B(7, 0) - 0.05, 'jan 2015', (ctx, t, k, L) => { camera(ctx, { x: 960, y: 540, z: 1.0 }, { x: 960, y: 540, z: 1.1 }, k); calendarCard(ctx, t, L, 'JANUARY', '2015', { sub: 'ONE YEAR EARLIER' }); }, null, 0.04);
  add(B(7, 'few') - 0.1, 'emails arrive', (ctx, t, k, L) => { camera(ctx, { x: 900, y: 560, z: 1.1 }, { x: 960, y: 560, z: 1.18 }, k);
    officeFloor(ctx, t, { desks: [420, 760, 1100], printerX: 1500 });
    [[420, CLERK2], [760, STAFF(3)], [1100, CLERK]].forEach(([x, c], i) => { drawChar(ctx, { ...c, x: x + 60, y: FLOOR, face: -1, mood: L > 1.2 + i * 0.4 ? 'smug' : 'neutral' }, t); bubble(ctx, x + 40, 330, 'NEW EMAIL', L - 0.4 - i * 0.4, { size: 34 }); }); },

  add(B(7, 'rasel') - 0.1, 'rasel', (ctx, t, k, L) => { camera(ctx, { x: 960, y: 560, z: 1.25 }, { x: 960, y: 520, z: 1.4 }, k);
    room(ctx, t, { wall: '#cfdbe0', wall2: '#8fa6b0', floor: '#4a4f5a', wainscot: 600, items: c => { windowFrame(c, 1250, 180, 360, 300, t); plant(c, 520, FLOOR, 1.1); } });

  add(B(7, 'his') - 0.1, 'cv email', (ctx, t, k, L) => { camera(ctx, { x: 960, y: 540, z: 1.0 }, { x: 900, y: 600, z: 1.12 }, k); emailWindow(ctx, t, L); }, null, 0.05);
